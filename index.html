<!DOCTYPE html>
<html>
<head>
    <title>Hyperbasis</title>
    <style>
        @font-face {
            font-family: 'Aptos';
            src: url('fonts/Aptos.ttf') format('truetype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Aptos';
            src: url('fonts/Aptos-SemiBold.ttf') format('truetype');
            font-weight: 600;
        }
        @font-face {
            font-family: 'Aptos';
            src: url('fonts/Aptos-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Aptos', -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Landing Page (Auth) */
        #landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #landing h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
        }

        #landing .subtitle {
            color: #555;
            margin-bottom: 40px;
        }

        .auth-container {
            background: #111;
            padding: 30px;
            border-radius: 4px;
            width: 100%;
            max-width: 360px;
            border: 1px solid #222;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: color 0.2s;
        }

        .auth-tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        .auth-tab:hover {
            color: #888;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .auth-form.active {
            display: flex;
        }

        .auth-form input {
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 2px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #666;
        }

        .auth-form input::placeholder {
            color: #444;
        }

        .auth-form button {
            padding: 12px;
            background: #fff;
            border: none;
            border-radius: 2px;
            color: #000;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-form button:hover {
            background: #ccc;
        }

        .error {
            color: #888;
            font-size: 12px;
            display: none;
        }

        .error.show {
            display: block;
        }

        /* Main Menu (after login) */
        #main-menu {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #main-menu.active {
            display: flex;
        }

        #landing.hidden {
            display: none;
        }

        #main-menu h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 10px;
        }

        #main-menu .welcome {
            color: #444;
            margin-bottom: 60px;
            font-size: 14px;
        }

        #main-menu .welcome strong {
            color: #666;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        .menu-btn {
            padding: 16px 32px;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: #1a1a1a;
            border-color: #444;
        }

        .menu-btn:disabled {
            color: #333;
            cursor: not-allowed;
        }

        .menu-btn:disabled:hover {
            background: #111;
            border-color: #333;
        }

        .menu-btn-secondary {
            background: none;
            color: #555;
            font-size: 13px;
            padding: 12px;
        }

        .menu-btn-secondary:hover {
            background: none;
            color: #888;
        }
    </style>
</head>
<body>
    <!-- Landing Page (Auth) -->
    <div id="landing">
        <h1>Hyperbasis</h1>
        <p class="subtitle">Build your infrastructure empire</p>

        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <p class="error" id="login-error"></p>
                <button type="submit">Login</button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form">
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <input type="password" id="signup-confirm" placeholder="Confirm Password" required>
                <p class="error" id="signup-error"></p>
                <button type="submit">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu">
        <h1>Hyperbasis</h1>
        <p class="welcome">Welcome, <strong id="display-username"></strong></p>

        <div class="menu-buttons">
            <button class="menu-btn" id="new-game-btn">New Game</button>
            <button class="menu-btn" id="load-game-btn" disabled>Load Game</button>
            <button class="menu-btn menu-btn-secondary" id="logout-btn">Logout</button>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
